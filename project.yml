# Definición del proyecto Xcode. No hay Mac: el .xcodeproj lo genera XcodeGen
# en la máquina de compilación (GitHub Actions / Codemagic). No se versiona.
name: SoundFast
options:
  bundleIdPrefix: com.edgardorocha
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "1"
    SF_BUILD_DATE: "local"

targets:
  SoundFast:
    type: application
    platform: iOS
    sources:
      - path: SoundFast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edgardorocha.soundfast
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: NO
    info:
      path: SoundFast/Info.plist
      properties:
        CFBundleDisplayName: SoundFast
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SFBuildDate: $(SF_BUILD_DATE)
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        ITSAppUsesNonExemptEncryption: false
        NSAppleMusicUsageDescription: SoundFast lee tu biblioteca para mostrar, reproducir y organizar tus canciones con ecualizador.
        # Carpeta "SoundFast" visible en Archivos y en "Dispositivos Apple" de Windows
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # "Abrir en SoundFast" desde otras apps
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
              - public.mp3
              - public.mpeg-4-audio
              - org.xiph.flac
        UIAppFonts:
          - Montserrat-Regular.ttf
          - Montserrat-Medium.ttf
          - Montserrat-SemiBold.ttf
          - Montserrat-Bold.ttf
          - Montserrat-ExtraBold.ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-Bold.ttf
    scheme:
      gatherCoverageData: false
