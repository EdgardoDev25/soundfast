workflows:
  soundfast-ios:
    name: SoundFast iOS (sin firmar)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Compilar IPA sin firmar
        script: bash scripts/build-ipa.sh "$BUILD_NUMBER"
    artifacts:
      - build/SoundFast.ipa
